<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>SP-Klassenchat</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: white;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loader {
            width: 42px;
            height: 42px;
            border: 4px solid #e5e5e5;
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div id="loading">
    <div class="loader"></div>
</div>

<script>
    const WEBSITE = "https://klassenchat-schule.base44.app";

    function openWebsite() {
        document.getElementById("loading").style.display = "flex";

        window.location.replace(WEBSITE);
    }

    // Erster Start
    openWebsite();

    // Wenn die Capacitor-App wieder in den Vordergrund kommt
    document.addEventListener("resume", function () {
        openWebsite();
    });

    // Zusätzlich für Android/WebView
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
            openWebsite();
        }
    });
</script>

</body>
</html>
